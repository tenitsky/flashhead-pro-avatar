name: Validate template
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install torch torchaudio torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow opencv-python-headless jupyter-server \
            "diffusers==0.36.0" transformers loguru pyloudnorm einops safetensors
      - name: Check shell and Python syntax
        run: |
          bash -n setup.sh
          bash -n bootstrap.sh
          python -m compileall -q custom_nodes tools
      - name: Workflows match the builder and the node schemas
        run: |
          python tools/build_workflow.py
          git diff --exit-code workflows
          python -B tools/test_workflows.py
      - name: Engine (chunk plan, audio windows, anchors, face crop, ffmpeg)
        run: python -B tools/test_engine.py
      - name: Pinned SoulX-FlashHead still matches the engine
        run: python -B tools/test_upstream.py
      - name: Storage and download regression tests
        run: |
          python -B tools/test_storage.py
          python -B tools/test_setup.py
      - name: Jupyter and setup integration tests
        run: |
          python -B tools/test_jupyter.py
          python -B tools/test_boot.py
